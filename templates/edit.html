<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense — MyExpense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>

<!-- Navigation Header -->
<header class="navbar">
    <div class="nav-container">
        <a href="/" class="brand">
            <div class="brand-icon">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z" />
                </svg>
            </div>
            <div class="brand-info">
                <span class="brand-title">MyExpense</span>
                <span class="brand-subtitle">Personal expense management</span>
            </div>
        </a>
        <div>
            <a href="/" class="button secondary btn-sm">
                <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
                Dashboard
            </a>
        </div>
    </div>
</header>

<main class="container narrow">
    <a href="/" class="back-link">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Back to Expenses
    </a>

    {% if message %}
        <div class="message {{ message_type }}">
            {% if message_type == 'success' %}
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            {% else %}
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
            {% endif %}
            <span>{{ message }}</span>
        </div>
    {% endif %}

    <section class="panel">
        <div class="panel-header">
            <div class="panel-title-group">
                <div class="panel-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                    </svg>
                </div>
                <div>
                    <h2 class="panel-title">Edit Expense</h2>
                    <p class="panel-tagline">Modify entry details and save updates</p>
                </div>
            </div>
            <span class="count-pill">ID #{{ expense.id }}</span>
        </div>

        <form method="POST" action="/edit/{{ expense.id }}" class="form-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="field-group full-width">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" maxlength="150" value="{{ expense.title }}" required>
            </div>

            <div class="field-group">
                <label for="amount">Amount</label>
                <div class="input-currency-group">
                    <span class="currency-addon">₹</span>
                    <input type="number" id="amount" name="amount" min="0.01" step="0.01" value="{{ expense.amount }}" required>
                </div>
            </div>

            <div class="field-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% for item in categories %}
                        <option value="{{ item }}" {% if expense.category == item %}selected{% endif %}>{{ item }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field-group full-width">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" value="{{ expense.date }}" required>
            </div>

            <div class="field-group full-width">
                <label for="note">Note (optional)</label>
                <textarea id="note" name="note" rows="3">{{ expense.note or "" }}</textarea>
            </div>

            <div class="full-width form-actions">
                <button type="submit" class="btn-primary">
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                    </svg>
                    Save Changes
                </button>
                <a class="button secondary" href="/">Cancel</a>
            </div>
        </form>
    </section>
</main>

</body>
</html>
